/rock_stacking:
  ros__parameters:
    # Center position parameters
    center_x: 0.0
    center_y: 0.0
    center_z: 0.1
    
    # Movement parameters
    approach_height: 0.05
    pick_height: 0.01
    feedrate: 1000
    
    # G-code settings
    gcode_file: "rock_pick_place.gcode"
    gripper_open_command: "M8"
    gripper_close_command: "M9"
    
    # Robot physical limits
    x_min: -60.0
    x_max: 60.0
    y_min: -60.0
    y_max: 60.0
    z_min: 0.0
    z_max: 100.0